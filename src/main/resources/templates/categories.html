<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Категории</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Категории</h1>

    <!-- Форма создания категории -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form action="/ui/categories" method="post">
                <div class="row g-2">
                    <div class="col-md-10">
                        <input type="text" name="name" class="form-control" placeholder="Название категории" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Список категорий -->
    <div class="list-group">
        <div th:each="category : ${categories}"
             class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">
                    <span th:text="${category.name}">Название</span>
                    <span class="badge bg-secondary ms-2" th:text="${category.id}">ID</span>
                </h5>
            </div>
            <div>
                <form th:action="@{/ui/categories/{id}/delete(id=${category.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
