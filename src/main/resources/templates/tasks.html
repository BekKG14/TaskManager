<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мой Таск Менеджер</title>
    <!-- Подключаем стили Bootstrap (для красоты) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Мои Задачи</h1>

    <!-- 1. ФОРМА СОЗДАНИЯ ЗАДАЧИ -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form action="/ui/tasks" method="post">
                <div class="row g-2">
                    <!-- Название -->
                    <div class="col-md-4">
                        <input type="text" name="title" class="form-control" placeholder="Что нужно сделать?" required>
                    </div>
                    <!-- Описание -->
                    <div class="col-md-3">
                        <input type="text" name="description" class="form-control" placeholder="Описание">
                    </div>
                    <!-- Дата -->
                    <div class="col-md-2">
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <!-- Время -->
                    <div class="col-md-2">
                        <input type="time" name="time" class="form-control">
                    </div>
                    <!-- Кнопка -->
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. СПИСОК ЗАДАЧ -->
    <div class="list-group">

        <!-- Цикл по задачам -->
        <div th:each="task : ${tasks}"
             class="list-group-item d-flex justify-content-between align-items-center"
             th:classappend="${task.status.name() == 'EXPIRED'} ? 'list-group-item-danger' :
                              (${task.status.name() == 'DONE'} ? 'list-group-item-success' : '')">

            <!-- Левая часть: Текст -->
            <div>
                <h5 class="mb-1">
                    <span th:text="${task.title}">Заголовок</span>
                    <!-- Бейджик статуса -->
                    <span class="badge bg-secondary ms-2" th:text="${task.status}">STATUS</span>
                </h5>
                <p class="mb-1 text-muted" th:text="${task.description}">Описание</p>

                <!-- Дата и Время -->
                <small class="text-muted">
                    Дедлайн:
                    <span th:text="${task.date}"></span>
                    <span th:text="${task.time}"></span>
                </small>
            </div>

            <!-- Правая часть: Кнопки -->
            <div>
                <!-- Кнопка "Сделано" (показываем, только если задача еще не сделана) -->
                <form th:if="${task.status.name() != 'DONE'}"
                      th:action="@{/ui/tasks/{id}/done(id=${task.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-success btn-sm me-1">✔</button>
                </form>

                <!-- Кнопка "Удалить" -->
                <form th:action="@{/ui/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
